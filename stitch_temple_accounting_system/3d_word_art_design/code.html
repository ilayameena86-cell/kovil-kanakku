<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <!-- Background gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a0e17"/>
      <stop offset="40%" stop-color="#7a1c1c"/>
      <stop offset="70%" stop-color="#3b080f"/>
      <stop offset="100%" stop-color="#1f0307"/>
    </linearGradient>

    <!-- Gold Text 3D Gradients -->
    <linearGradient id="gold3d" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF8D6"/>
      <stop offset="25%" stop-color="#F7D070"/>
      <stop offset="50%" stop-color="#D49A24"/>
      <stop offset="75%" stop-color="#996515"/>
      <stop offset="100%" stop-color="#54370A"/>
    </linearGradient>

    <linearGradient id="goldShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BF8C2A"/>
      <stop offset="20%" stop-color="#FFEC9E"/>
      <stop offset="40%" stop-color="#D6972A"/>
      <stop offset="60%" stop-color="#FFF4BC"/>
      <stop offset="80%" stop-color="#DCA432"/>
      <stop offset="100%" stop-color="#A16914"/>
    </linearGradient>

    <radialGradient id="sunGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FFE89E" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#C57A1E" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#3b080f" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters for 3D bevel & drop shadow -->
    <filter id="goldDropShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#FFEFA8" flood-opacity="0.5"/>
    </filter>

    <filter id="badgeGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .tamil-title {
      font-family: 'Noto Serif Tamil', 'Latha', 'Mukta Malar', 'serif';
      font-weight: 900;
      text-anchor: middle;
    }
    .sub-title {
      font-family: 'Noto Sans Tamil', 'sans-serif';
      font-weight: 700;
      letter-spacing: 2px;
      text-anchor: middle;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#sunGlow)"/>

  <!-- Ornate Outer Gold Border -->
  <rect x="25" y="25" width="1150" height="580" rx="16" fill="none" stroke="#D4AF37" stroke-width="3" stroke-dasharray="14 6" opacity="0.6"/>
  <rect x="35" y="35" width="1130" height="560" rx="12" fill="none" stroke="#FBD26D" stroke-width="1.5" opacity="0.8"/>
  <rect x="42" y="42" width="1116" height="546" rx="8" fill="none" stroke="#996515" stroke-width="1" opacity="0.5"/>

  <!-- Traditional Corner Kolam Ornaments -->
  <!-- Top-Left -->
  <g transform="translate(45, 45)" stroke="#FBD26D" stroke-width="1.5" fill="none">
    <path d="M0,0 Q40,5 50,50 Q5,40 0,0 Z"/>
    <circle cx="20" cy="20" r="4" fill="#FBD26D"/>
    <path d="M10,0 L60,0 M0,10 L0,60"/>
  </g>
  <!-- Top-Right -->
  <g transform="translate(1155, 45) scale(-1, 1)" stroke="#FBD26D" stroke-width="1.5" fill="none">
    <path d="M0,0 Q40,5 50,50 Q5,40 0,0 Z"/>
    <circle cx="20" cy="20" r="4" fill="#FBD26D"/>
    <path d="M10,0 L60,0 M0,10 L0,60"/>
  </g>
  <!-- Bottom-Left -->
  <g transform="translate(45, 585) scale(1, -1)" stroke="#FBD26D" stroke-width="1.5" fill="none">
    <path d="M0,0 Q40,5 50,50 Q5,40 0,0 Z"/>
    <circle cx="20" cy="20" r="4" fill="#FBD26D"/>
    <path d="M10,0 L60,0 M0,10 L0,60"/>
  </g>
  <!-- Bottom-Right -->
  <g transform="translate(1155, 585) scale(-1, -1)" stroke="#FBD26D" stroke-width="1.5" fill="none">
    <path d="M0,0 Q40,5 50,50 Q5,40 0,0 Z"/>
    <circle cx="20" cy="20" r="4" fill="#FBD26D"/>
    <path d="M10,0 L60,0 M0,10 L0,60"/>
  </g>

  <!-- Top Invocational Pillayar Suzhi & Mantram -->
  <g transform="translate(600, 95)" text-anchor="middle">
    <!-- Traditional Pillayar Suzhi -->
    <path d="M-15,-5 C-25,-15 -5,-25 0,-15 C5,-5 2,-2 8,2 L16,5" stroke="#FDE48C" stroke-width="3" fill="none"/>
    <text x="0" y="32" fill="#FCE592" font-size="22" class="sub-title" letter-spacing="4">
      ✦ ஓம் சக்தி • வெற்றிவேல் முருகன் துணை ✦
    </text>
  </g>

  <!-- Decorative Floral Dividers -->
  <path d="M300,150 Q600,165 900,150" stroke="url(#goldShine)" stroke-width="2.5" fill="none" opacity="0.85"/>
  <circle cx="600" cy="158" r="7" fill="#FCE592" stroke="#996515" stroke-width="2"/>
  <circle cx="560" cy="157" r="4" fill="#FBD26D"/>
  <circle cx="640" cy="157" r="4" fill="#FBD26D"/>
  <polygon points="600,140 605,150 595,150" fill="#FFE89E"/>

  <!-- MAIN WORD ART 3D CALLIGRAPHY: LINE 1 -->
  <!-- 3D Shadow Layers -->
  <text x="600" y="248" class="tamil-title" font-size="64" fill="#200508" letter-spacing="2">
    ஶ்ரீ ஏழைகாத்த அம்மன்
  </text>
  <text x="600" y="244" class="tamil-title" font-size="64" fill="#6B1D25" letter-spacing="2">
    ஶ்ரீ ஏழைகாத்த அம்மன்
  </text>
  <!-- Foreground Gold Bevel & Glow -->
  <text x="600" y="240" class="tamil-title" font-size="64" fill="url(#gold3d)" stroke="#FFF6BD" stroke-width="1.5" filter="url(#goldDropShadow)" letter-spacing="2">
    ஶ்ரீ ஏழைகாத்த அம்மன்
  </text>

  <!-- MAIN WORD ART: CONNECTOR / AMPERSAND BADGE -->
  <g transform="translate(600, 290)">
    <rect x="-80" y="-18" width="160" height="34" rx="17" fill="#420b12" stroke="url(#goldShine)" stroke-width="2"/>
    <text x="0" y="6" text-anchor="middle" fill="#FFEAA5" font-size="20" font-family="'Noto Sans Tamil', sans-serif" font-weight="bold">
      சமேத
    </text>
  </g>

  <!-- MAIN WORD ART 3D CALLIGRAPHY: LINE 2 -->
  <text x="600" y="388" class="tamil-title" font-size="58" fill="#200508" letter-spacing="2">
    வல்லடிகார சுவாமி
  </text>
  <text x="600" y="384" class="tamil-title" font-size="58" fill="#6B1D25" letter-spacing="2">
    வல்லடிகார சுவாமி
  </text>
  <text x="600" y="380" class="tamil-title" font-size="58" fill="url(#gold3d)" stroke="#FFF6BD" stroke-width="1.5" filter="url(#goldDropShadow)" letter-spacing="2">
    வல்லடிகார சுவாமி
  </text>

  <!-- Bottom Line: திருக்கோவில் (Temple Word Art) -->
  <g transform="translate(600, 460)">
    <!-- Decorative Wings -->
    <path d="M-280,-8 L-140,-8" stroke="url(#goldShine)" stroke-width="2"/>
    <path d="M140,-8 L280,-8" stroke="url(#goldShine)" stroke-width="2"/>
    <circle cx="-135" cy="-8" r="4" fill="#FCE592"/>
    <circle cx="135" cy="-8" r="4" fill="#FCE592"/>

    <text x="0" y="2" class="tamil-title" font-size="44" fill="url(#goldShine)" stroke="#804E10" stroke-width="1" filter="url(#goldDropShadow)" letter-spacing="6">
      திருக்கோவில்
    </text>
  </g>

  <!-- Sub-ribbon Banner: தேவஸ்தானம் & ஊர் பெயர் -->
  <g transform="translate(600, 535)">
    <path d="M-260,-22 L260,-22 L240,16 L-240,16 Z" fill="#2d050c" stroke="url(#goldShine)" stroke-width="1.5"/>
    <text x="0" y="2" text-anchor="middle" fill="#FEECA1" font-size="19" font-family="'Noto Sans Tamil', sans-serif" font-weight="600" letter-spacing="3">
      பல்லவராயன்பட்டி தேவஸ்தானம் • புதுக்கோட்டை மாவட்டம்
    </text>
  </g>
</svg>
